name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - name: Install locked dependencies
        run: uv sync --locked --all-groups
      - name: Secret scan
        run: uv run python scripts/check_secrets.py
      - name: Lint
        run: uv run ruff check src tests scripts
      - name: Type check
        run: uv run mypy src/simajilord
      - name: Test
        run: uv run pytest
      - name: Audio doctor
        run: uv run simajilord-audio-doctor
      - name: Compile
        run: uv run python -m compileall -q src
      - name: Build distributable wheel
        run: |
          uv build
          python - <<'PY'
          from pathlib import Path
          import tarfile
          from zipfile import ZipFile

          wheel = next(Path("dist").glob("*.whl"))
          sdist = next(Path("dist").glob("*.tar.gz"))
          with ZipFile(wheel) as archive:
              names = set(archive.namelist())
          required = {
              "simajilord/activity/static/index.html",
              "simajilord/activity/server.py",
          }
          missing = required - names
          if missing:
            raise SystemExit(f"Wheel is missing: {sorted(missing)}")

          with tarfile.open(sdist, "r:gz") as archive:
              sdist_names = archive.getnames()
          forbidden_parts = {
              ".data",
              ".venv",
              "artifacts",
              "datasets",
              "dist",
              "sealed-final-test",
              "shogi_ai",
          }
          forbidden_suffixes = {
              ".7z",
              ".bin",
              ".ckpt",
              ".hcpe",
              ".jsonl",
              ".npz",
              ".onnx",
              ".psv",
              ".pt",
              ".pth",
              ".safetensors",
              ".ybb",
          }
          for name in sdist_names:
              path = Path(name)
              if forbidden_parts.intersection(path.parts):
                  raise SystemExit(f"Root sdist contains private/generated scope: {name}")
              if path.suffix in forbidden_suffixes:
                  raise SystemExit(f"Root sdist contains model/data artifact: {name}")
          if not any(Path(name).name == "LICENSE" for name in sdist_names):
              raise SystemExit("Root sdist does not contain LICENSE")
          if len(sdist_names) > 1_000 or sdist.stat().st_size > 10_000_000:
              raise SystemExit(
                  f"Root sdist scope unexpectedly expanded: {len(sdist_names)} files, "
                  f"{sdist.stat().st_size} bytes"
              )
          PY

  python-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - name: Install locked dependencies
        run: uv sync --locked --all-groups --python "${{ matrix.python-version }}"
      - name: Test declared Python compatibility
        run: uv run --python "${{ matrix.python-version }}" pytest
      - name: Compile
        run: uv run --python "${{ matrix.python-version }}" python -m compileall -q src

  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: Install FFmpeg
        run: brew install ffmpeg
      - name: Install locked dependencies
        run: uv sync --locked --all-groups
      - name: Build the on-device Translation helper
        run: |
          swift build --package-path native/macos/TranslationHelper -c release
          chmod 700 native/macos/TranslationHelper/.build/release/TranslationHelper
      - name: Smoke-test local language detection
        run: |
          printf '%s\n' '{"operation":"detect","text":"おはようございます"}' \
            | native/macos/TranslationHelper/.build/release/TranslationHelper \
            | python -c 'import json,sys; data=json.load(sys.stdin); assert data["ok"]'
      - name: Smoke-test Translation helper resolution from an installed wheel
        run: |
          uv build
          python -m venv "$RUNNER_TEMP/simajilord-wheel-smoke"
          "$RUNNER_TEMP/simajilord-wheel-smoke/bin/pip" install dist/*.whl
          TRANSLATION_HELPER_PATH="$PWD/native/macos/TranslationHelper/.build/release/TranslationHelper" \
            "$RUNNER_TEMP/simajilord-wheel-smoke/bin/simajilord-translation-doctor" --json
          if env -u TRANSLATION_HELPER_PATH \
            "$RUNNER_TEMP/simajilord-wheel-smoke/bin/simajilord-translation-doctor" --json
          then
            echo "Installed wheel unexpectedly resolved a source checkout helper."
            exit 1
          fi
      - name: macOS integration tests
        run: uv run pytest -q tests/test_translation.py tests/test_discord_audio.py
      - name: macOS Seatbelt boundary tests
        id: seatbelt-tests
        continue-on-error: true
        run: |
          mkdir -p .data/ci
          uv run pytest -q tests/test_compute.py tests/test_isolated_shell.py \
            --junitxml=.data/ci/seatbelt-pytest.xml
      - name: Verify macOS Seatbelt boundary results
        if: always()
        env:
          SEATBELT_PYTEST_OUTCOME: ${{ steps.seatbelt-tests.outcome }}
        run: |
          uv run python scripts/report_pytest_junit.py \
            .data/ci/seatbelt-pytest.xml \
            --title "macOS Seatbelt boundary tests" \
            --require-no-skips
          if [ "$SEATBELT_PYTEST_OUTCOME" != "success" ]; then
            echo "Seatbelt pytest did not complete successfully."
            exit 1
          fi
      - name: Offline Discord preview
        run: uv run simajilord-offline-preview --output-dir .data/ci-preview

  shogi-ai:
    runs-on: macos-15
    timeout-minutes: 20
    defaults:
      run:
        working-directory: shogi_ai
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: shogi_ai/uv.lock
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: Install locked Meteo dependencies
        run: uv sync --locked --all-groups
      - name: Lint Meteo
        run: uv run ruff check .
      - name: Type-check Meteo
        run: uv run mypy src
      - name: Test Meteo
        run: uv run pytest -q
      - name: Compile Meteo
        run: uv run python -m compileall -q src
      - name: Audit Meteo tracked repository boundary
        run: uv run python -m simajilord_shogi.release_guard repository .
      - name: Audit Meteo public source
        run: uv run python -m simajilord_shogi.release_guard source .
      - name: Build Meteo wheel and sdist
        run: |
          rm -rf dist
          uv build
          uv run python - <<'PY'
          from pathlib import Path
          import tarfile
          from zipfile import ZipFile

          forbidden_parts = {
              "artifacts",
              "datasets",
              ".venv",
              ".mypy_cache",
              ".pytest_cache",
              ".ruff_cache",
              "__pycache__",
              "sealed",
              "sealed_final_test",
          }
          forbidden_suffixes = {
              ".7z",
              ".bin",
              ".ckpt",
              ".csa",
              ".engine",
              ".hcpe",
              ".jsonl",
              ".ki2",
              ".kif",
              ".nn",
              ".npz",
              ".onnx",
              ".pb",
              ".psn",
              ".psv",
              ".pt",
              ".pth",
              ".safetensors",
              ".tflite",
              ".ybb",
          }

          wheel = next(Path("dist").glob("*.whl"))
          sdist = next(Path("dist").glob("*.tar.gz"))
          with ZipFile(wheel) as archive:
              wheel_names = archive.namelist()
          with tarfile.open(sdist, "r:gz") as archive:
              sdist_names = archive.getnames()

          for archive_name, names in (("wheel", wheel_names), ("sdist", sdist_names)):
              for name in names:
                  path = Path(name)
                  if forbidden_parts.intersection(path.parts):
                      raise SystemExit(f"{archive_name} contains generated data: {name}")
                  if path.suffix in forbidden_suffixes:
                      raise SystemExit(f"{archive_name} contains checkpoint data: {name}")
              if not any(Path(name).name == "LICENSE" for name in names):
                  raise SystemExit(f"{archive_name} does not contain LICENSE")

          if len(sdist_names) > 200 or sdist.stat().st_size > 5_000_000:
              raise SystemExit(
                  f"sdist scope unexpectedly expanded: {len(sdist_names)} files, "
                  f"{sdist.stat().st_size} bytes"
              )
          PY
          uv run python -m simajilord_shogi.release_guard archive dist/*.whl dist/*.tar.gz
      - name: Smoke-test Meteo CLI
        run: uv run simajilord-shogi --help

  activity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v6.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: activity/package-lock.json
      - name: Install locked Activity dependencies
        run: npm ci
        working-directory: activity
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: activity
      - name: Audit and build
        run: |
          npm audit
          npm run build
        working-directory: activity
      - name: Desktop and mobile visual checks
        run: npm run test:visual
        working-directory: activity
      - uses: actions/upload-artifact@v6.0.0
        if: always()
        with:
          name: activity-visual-checks
          path: activity/test-results/
          if-no-files-found: error
