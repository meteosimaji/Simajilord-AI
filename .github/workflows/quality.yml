name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - name: Install locked dependencies
        run: uv sync --locked --all-groups
      - name: Secret scan
        run: uv run python scripts/check_secrets.py
      - name: Lint
        run: uv run ruff check src tests scripts
      - name: Type check
        run: uv run mypy src/simajilord
      - name: Test
        run: uv run pytest
      - name: Audio doctor
        run: uv run simajilord-audio-doctor
      - name: Compile
        run: uv run python -m compileall -q src
      - name: Build distributable wheel
        run: |
          uv build
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheel = next(Path("dist").glob("*.whl"))
          with ZipFile(wheel) as archive:
              names = set(archive.namelist())
          required = {
              "simajilord/activity/static/index.html",
              "simajilord/activity/server.py",
          }
          missing = required - names
          if missing:
            raise SystemExit(f"Wheel is missing: {sorted(missing)}")
          PY

  python-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - name: Install locked dependencies
        run: uv sync --locked --all-groups --python "${{ matrix.python-version }}"
      - name: Test declared Python compatibility
        run: uv run --python "${{ matrix.python-version }}" pytest
      - name: Compile
        run: uv run --python "${{ matrix.python-version }}" python -m compileall -q src

  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: Install FFmpeg
        run: brew install ffmpeg
      - name: Install locked dependencies
        run: uv sync --locked --all-groups
      - name: Build the on-device Translation helper
        run: |
          swift build --package-path native/macos/TranslationHelper -c release
          chmod 700 native/macos/TranslationHelper/.build/release/TranslationHelper
      - name: Smoke-test local language detection
        run: |
          printf '%s\n' '{"operation":"detect","text":"おはようございます"}' \
            | native/macos/TranslationHelper/.build/release/TranslationHelper \
            | python -c 'import json,sys; data=json.load(sys.stdin); assert data["ok"]'
      - name: Smoke-test Translation helper resolution from an installed wheel
        run: |
          uv build
          python -m venv "$RUNNER_TEMP/simajilord-wheel-smoke"
          "$RUNNER_TEMP/simajilord-wheel-smoke/bin/pip" install dist/*.whl
          TRANSLATION_HELPER_PATH="$PWD/native/macos/TranslationHelper/.build/release/TranslationHelper" \
            "$RUNNER_TEMP/simajilord-wheel-smoke/bin/simajilord-translation-doctor" --json
          if env -u TRANSLATION_HELPER_PATH \
            "$RUNNER_TEMP/simajilord-wheel-smoke/bin/simajilord-translation-doctor" --json
          then
            echo "Installed wheel unexpectedly resolved a source checkout helper."
            exit 1
          fi
      - name: macOS integration tests
        run: uv run pytest -q tests/test_translation.py tests/test_discord_audio.py
      - name: macOS Seatbelt boundary tests
        id: seatbelt-tests
        continue-on-error: true
        run: |
          mkdir -p .data/ci
          uv run pytest -q tests/test_compute.py tests/test_isolated_shell.py \
            --junitxml=.data/ci/seatbelt-pytest.xml
      - name: Verify macOS Seatbelt boundary results
        if: always()
        env:
          SEATBELT_PYTEST_OUTCOME: ${{ steps.seatbelt-tests.outcome }}
        run: |
          uv run python scripts/report_pytest_junit.py \
            .data/ci/seatbelt-pytest.xml \
            --title "macOS Seatbelt boundary tests" \
            --require-no-skips
          if [ "$SEATBELT_PYTEST_OUTCOME" != "success" ]; then
            echo "Seatbelt pytest did not complete successfully."
            exit 1
          fi
      - name: Offline Discord preview
        run: uv run simajilord-offline-preview --output-dir .data/ci-preview

  activity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v6.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: activity/package-lock.json
      - name: Install locked Activity dependencies
        run: npm ci
        working-directory: activity
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: activity
      - name: Audit and build
        run: |
          npm audit
          npm run build
        working-directory: activity
      - name: Desktop and mobile visual checks
        run: npm run test:visual
        working-directory: activity
      - uses: actions/upload-artifact@v6.0.0
        if: always()
        with:
          name: activity-visual-checks
          path: activity/test-results/
          if-no-files-found: error
