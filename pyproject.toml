[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "simajilord-ai"
version = "0.1.0"
description = "A local-first capability platform with transport adapters"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "aiohttp>=3.14,<4",
  "davey>=0.1,<1",
  "discord.py==2.7.1",
  "pillow>=11.3,<13",
  "pynacl>=1.6.2,<1.7",
  "pypdf>=6.6,<7",
  "python-dotenv>=1.1.1,<2",
  "yt-dlp",
  "yt-dlp-ejs==0.8.0",
]

[project.scripts]
simajilord-discord = "simajilord.integrations.discord.__main__:main"
simajilord-audio-doctor = "simajilord.diagnostics.audio:main"
simajilord-offline-preview = "simajilord.diagnostics.offline_discord:main"
simajilord-web-doctor = "simajilord.diagnostics.web:main"

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[tool.uv.sources]
yt-dlp = { path = "vendor/yt-dlp" }

[tool.hatch.build.targets.wheel]
packages = ["src/simajilord"]

[tool.hatch.build.targets.sdist.force-include]
"src/simajilord/activity/static" = "src/simajilord/activity/static"

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/simajilord"]
exclude = ["vendor/"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["vendor/yt-dlp"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
