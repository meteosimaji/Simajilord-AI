[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "simajilord-shogi"
version = "0.1.0"
description = "Standalone MLX shogi engine, self-play, and training lab"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
  "rsshogi==1.1.0",
  "mlx==0.32.0; platform_system == 'Darwin' and platform_machine == 'arm64'",
  "psutil>=7,<8",
  "numpy>=1.26,<1.27; python_version < '3.13'",
  "numpy>=2.1,<3; python_version >= '3.13'",
]

[project.scripts]
simajilord-shogi = "simajilord_shogi.cli:main"
simajilord-nnue = "simajilord_shogi.nnue_runner:main"

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=9.0.3,<10",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/simajilord_shogi"]

[tool.hatch.build.targets.sdist]
include = [
  "/LICENSE",
  "/README.md",
  "/DATASET_AUDIT.md",
  "/MODEL_RIGHTS.md",
  "/LEARNING_STRATEGY.md",
  "/NUMERICAL_TRAINING_GUIDE.md",
  "/TEACHER_LINEAGE.md",
  "/RESEARCH.md",
  "/VALIDATION.md",
  "/FLOODGATE.md",
  "/SHOGIHOME.md",
  "/pyproject.toml",
  "/src",
  "/tests",
]
exclude = [
  "/artifacts",
  "/datasets",
  "/.venv",
  "/.mypy_cache",
  "/.pytest_cache",
  "/.ruff_cache",
  "**/*.safetensors",
  "**/*.npz",
  "**/*.onnx",
  "**/*.bin",
  "**/*.pt",
  "**/*.pth",
  "**/*.ckpt",
  "**/*.psv",
  "**/*.hcpe",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["simajilord_shogi"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
  "simajilord_shogi.mlx_nnue",
  "simajilord_shogi.model",
  "simajilord_shogi.trainer",
]
disable_error_code = ["attr-defined", "misc", "name-defined", "no-untyped-call"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "A"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
